name: Run Drizzle Migration

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v1

      - name: Install backend dependencies
        working-directory: ./apps/backend
        run: bun install

      - name: Force Supabase DNS to IPv4
        run: |
          IP=$(dig +short db.kivdcyishetlbakszjrz.supabase.co | grep -E '^[0-9\.]+$' | head -n1)
          echo "Using IPv4: $IP"
          echo "$IP db.kivdcyishetlbakszjrz.supabase.co" | sudo tee -a /etc/hosts

      - name: Run Drizzle Migration
        working-directory: ./apps/backend
        env:
          DATABASE_URL: ${{ secrets.APPS_JAWA_DATABASE_SECRET }}
        run: |
          echo "Running drizzle-kit push..."
          bun run db:push
